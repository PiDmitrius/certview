services:
  certget:
    image: pidmitrius/certget:latest
    restart: unless-stopped
    networks: [internal]

  certview:
    image: pidmitrius/certview:latest
    restart: unless-stopped
    environment:
      CERTGET_URL: http://certget:8080
    ports:
      - "${CERTVIEW_HTTP_BIND:-0.0.0.0}:${CERTVIEW_HTTP_PORT:-8080}:8080"
      - "${CERTVIEW_ADMIN_BIND:-127.0.0.1}:${CERTVIEW_ADMIN_PORT:-8081}:8081"
    volumes:
      - certview-data:/data
    networks: [internal]
    depends_on:
      - certget

networks:
  internal:

volumes:
  certview-data:
    name: ${CERTVIEW_DATA_VOLUME:-certview-data}
